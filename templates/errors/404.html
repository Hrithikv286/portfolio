{% extends 'base.html' %}
{% block title %}404 - Page Not Found | ElectroStore{% endblock %}

{% block content %}
<div class="error-page" data-error-code="{{ error_code }}">
  <div class="error-page-content">
    <div class="error-code-display">404</div>
    <h1 class="error-page-title">Page Not Found</h1>
    <p class="error-page-msg">
      {{ error_message }}<br>
      <span style="color:var(--text-muted);">{{ error_description }}</span>
    </p>
    <div class="error-page-actions">
      <a href="/" class="btn btn-primary btn-lg" id="error-404-home-btn">
        <i class="fas fa-home"></i> Go Home
      </a>
      <a href="/products/" class="btn btn-secondary btn-lg">
        <i class="fas fa-th-large"></i> Browse Products
      </a>
      <button class="btn btn-outline btn-lg" id="ask-assistant-btn">
        <i class="fas fa-robot"></i> Ask Assistant
      </button>
    </div>

    <div style="margin-top:2.5rem; padding:1.5rem; background:var(--bg-700); border:1px solid var(--border); border-radius:var(--radius-lg); text-align:left;">
      <h3 style="font-size:1rem; margin-bottom:0.75rem; color:var(--text-muted);">Quick Links</h3>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <a href="/products/" class="btn btn-sm btn-secondary">📱 Smartphones</a>
        <a href="/products/?category=laptops" class="btn btn-sm btn-secondary">💻 Laptops</a>
        <a href="/faq/" class="btn btn-sm btn-secondary">❓ FAQs</a>
        <a href="/contact/" class="btn btn-sm btn-secondary">📩 Contact</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
